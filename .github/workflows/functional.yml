name: Functional

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  functional:
    name: Complete wired regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      - name: Check every test module is wired
        run: python3 scripts/check_test_wiring.py

      - name: Build complete functional suite
        run: lake build FunctionalTests

      - name: Test repository validation scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build and smoke-test public executables
        run: python3 scripts/smoke_test_executables.py
