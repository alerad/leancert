name: Showcase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  showcase:
    name: Supported and curated demonstrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build supported examples
        run: lake build Examples
      - name: Build curated success and failure demonstrations
        run: lake build Showcase
